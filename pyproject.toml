[project]
name = "zhiyuan"
version = "0.1.0"
description = "知源 — 公司个人知识库问答系统（RAG）"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
    "langchain-openai>=0.3,<0.4",
    "langfuse>=3,<4",
    "langchain>=1,<2",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI 的 Depends() 参数默认值是框架惯用法
    "BLE001", # 缓存/鉴权/可观测路径故意宽捕获：可选组件挂掉必须降级而非中断
    "S110",   # 同上：try-except-pass 是降级静默跳过的既定写法
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
