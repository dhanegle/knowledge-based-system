services:
  # ───── 前端 (nginx + Vue 静态文件) ─────
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ───── 后端 (FastAPI) ─────
  backend:
    build: .
    environment:
      ZHIYUAN_DATABASE_URL: postgresql+asyncpg://zhiyuan:zhiyuan_dev@postgres:5432/zhiyuan
      ZHIYUAN_QDRANT_URL: http://qdrant:6333
      ZHIYUAN_REDIS_URL: redis://redis:6379/0
      ZHIYUAN_DEBUG: "false"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # ───── 向量数据库 ─────
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ───── 关系数据库 ─────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhiyuan
      POSTGRES_PASSWORD: zhiyuan_dev
      POSTGRES_DB: zhiyuan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyuan"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ───── 缓存 ─────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
  redis_data:
